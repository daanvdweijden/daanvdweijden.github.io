name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  schedule:
    # Once a day at 12:00 UTC so build-time data (e.g. the /music stats.fm
    # snapshot) refreshes even on days with no push to main.
    - cron: "0 12 * * *"
  workflow_dispatch: {}

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Puzzle data lives on the `puzzle-data` orphan branch, not in main —
      # that keeps main's history free of the 6x/day data commits. Its files
      # sit at that branch's root and land here as data/*.csv + activity.json,
      # which is where src/lib/puzzles.ts reads them at build time. Must run
      # before `npm run build`, and after the root checkout (which cleans the
      # workspace and would otherwise wipe this).
      - uses: actions/checkout@v4
        with:
          ref: puzzle-data
          path: data

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run build
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
